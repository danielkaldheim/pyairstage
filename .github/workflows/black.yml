name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: psf/black@stable
      - name: Install tools
        run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - name: Test (pytest)
        run: python -m pytest
